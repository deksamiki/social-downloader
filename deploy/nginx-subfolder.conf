# ── Option B: subfolder → example.com/dl/ ──
# Needs in .env: ROOT_PATH=/dl
# Run: ROOT_PATH=/dl uvicorn app:app --host 127.0.0.1 --port 8000
server {
    listen 80;
    server_name example.com;
    client_max_body_size 200M;

    location /dl/ {
        rewrite ^/dl(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # tells FastAPI its public prefix (uvicorn --root-path also works):
        proxy_set_header X-Forwarded-Prefix /dl;
    }
}
# NOTE: keep trailing slashes consistent, open https://example.com/dl/
